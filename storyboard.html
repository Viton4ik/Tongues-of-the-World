<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard — Tongues of the World</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#05070f;color:#fff;font-family:'Space Grotesk',sans-serif;padding:32px}
  h1{font:900 54px 'Fraunces';margin:0 0 6px}h1 em{color:#ffcf4a}
  p.sub{opacity:.7;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:22px}
  figure{margin:0;background:#0b1630;border-radius:14px;overflow:hidden;border:1px solid #ffffff1a}
  .frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}
  .frame iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
  figcaption{padding:10px 14px;font-size:15px;display:flex;gap:10px;align-items:center}
  figcaption b{background:#ffcf4a;color:#0b1630;border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
  a{color:#7ee8ff}
</style>
</head>
<body>
<h1>Tongues of <em>the World</em> — storyboard</h1>
<p class="sub">Key frames rendered live from the film engine. Click a frame to open the film at that moment. <a href="index.html">▶ Watch the full film</a></p>
<div class="grid" id="grid"></div>
<script>
  const frames = (new URLSearchParams(location.search).get('frames') || '').split(',').filter(Boolean).map(Number);
  const list = frames.length ? frames : [5, 13, 19, 33, 46, 57, 75, 95, 111, 118, 134, 156, 164, 178, 186, 205, 216, 228, 247, 258, 272, 286, 293, 305, 315, 326, 342, 351, 358];
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const grid = document.getElementById('grid');
  list.forEach(t => {
    const f = document.createElement('figure');
    f.innerHTML = `<a class="frame" href="index.html#t=${t}"><iframe loading="eager" src="index.html#t=${t}&still" title="Frame ${fmt(t)}"></iframe></a><figcaption><b>${fmt(t)}</b><span>frame at ${t}s</span></figcaption>`;
    grid.appendChild(f);
  });
  const scale = () => document.querySelectorAll('.frame').forEach(fr => fr.querySelector('iframe').style.transform = `scale(${fr.clientWidth / 1920})`);
  addEventListener('resize', scale); scale();
</script>
</body>
</html>
